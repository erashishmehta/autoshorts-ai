<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AutoShorts AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #10111b;
            color: white;
            min-height: 100vh;
        }

        .main-card {
            background: #1b1d2b;
            border: 1px solid #34364b;
            border-radius: 20px;
            padding: 35px;
        }

        .upload-area {
            border: 2px dashed #7776e8;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            background: #24263a;
        }

        .btn-generate {
            background: #7776e8;
            color: white;
            border: none;
            padding: 13px 30px;
            border-radius: 10px;
        }

        .btn-generate:hover {
            background: #5d5bd1;
            color: white;
        }

        .muted {
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">🎬 AutoShorts AI</h1>
            <p class="muted">
                Turn long videos into engaging YouTube Shorts automatically.
            </p>
        </div>

        <div class="main-card mx-auto" style="max-width: 750px">

            <h3 class="mb-4">Create your Shorts</h3>

            <form id="uploadForm">

                <div class="upload-area mb-4">
                    <h2>⬆️</h2>
                    <h5>Upload your long video</h5>
                    <p class="muted">MP4, MOV, MKV or WEBM</p>

                    <input type="file" id="video" class="form-control mt-3"
                        accept="video/mp4,video/quicktime,video/x-matroska,video/webm" required>
                </div>

                <button class="btn btn-generate w-100" type="submit" id="generateBtn">
                    Generate YouTube Shorts
                </button>

            </form>

            <div id="statusArea" class="mt-4" style="display:none">
                <h5 id="statusText">Uploading...</h5>

                <div class="progress mt-3">
                    <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                        style="width: 10%"></div>
                </div>

                <div id="result" class="mt-4"></div>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const statusArea = document.getElementById("statusArea");
        const statusText = document.getElementById("statusText");
        const progressBar = document.getElementById("progressBar");
        const result = document.getElementById("result");
        const button = document.getElementById("generateBtn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const file = document.getElementById("video").files[0];

            if (!file) return;

            button.disabled = true;
            statusArea.style.display = "block";
            statusText.innerText = "Uploading video...";
            result.innerHTML = "";
            progressBar.style.width = "10%";

            const formData = new FormData();
            formData.append("video", file);

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || "Upload failed");
                }

                const jobId = data.job_id;

                statusText.innerText = "Video uploaded. Processing...";
                progressBar.style.width = "30%";

                const poll = async () => {
                    const response = await fetch(`/api/status/${jobId}`);
                    const status = await response.json();

                    statusText.innerText = status.message || status.status;

                    if (status.status === "completed") {
                        progressBar.style.width = "100%";
                        progressBar.style.display = "none"

                        result.innerHTML = `
                    <div class="alert alert-success">
                        Successfully generated ${status.count} Shorts!
                    </div>
                    <a href="${status.download}"
                       class="btn btn-success w-100">
                       Download All Shorts (ZIP)
                    </a>
                `;

                        button.disabled = false;
                        return;
                    }

                    if (status.status === "failed") {
                        throw new Error(status.message);
                    }

                    progressBar.style.width =
                        status.status === "processing" ? "65%" : "30%";

                    setTimeout(poll, 3000);
                };

                await poll();

            } catch (error) {
                statusText.innerText = "Something went wrong";
                result.innerHTML = `
            <div class="alert alert-danger">
                ${error.message}
            </div>
        `;
                button.disabled = false;
            }
        });
    </script>

</body>

</html>
